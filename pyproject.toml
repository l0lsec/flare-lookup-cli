[project]
name = "flare-lookup-cli"
version = "0.1.0"
description = "CLI for Flare API lookups (events & credentials) with export to JSON/CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
flare-lookup = "flare_lookup_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
